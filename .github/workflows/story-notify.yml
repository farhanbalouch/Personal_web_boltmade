name: Notify direct story and project updates
on:
  push:
    branches: [main]
    paths:
      - 'src/data/story-chapters.json'
      - 'src/data/stories.json'
      - 'src/data/content.tsx'
permissions:
  contents: read
jobs:
  notify:
    # Automated publishing has its own delivery step and idempotency key.
    if: github.actor != 'github-actions[bot]' && !startsWith(github.event.head_commit.message, 'Studio integration:')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Notify after the update is live
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          UPDATE_PATH: /work
        run: node scripts/notify-manual-update.mjs
