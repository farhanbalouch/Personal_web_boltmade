name: Studio app quality checks
on:
  pull_request:
    paths:
      - 'studio-app/**'
      - '.github/workflows/studio-app-checks.yml'
  push:
    branches: [main]
    paths:
      - 'studio-app/**'
      - '.github/workflows/studio-app-checks.yml'
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
