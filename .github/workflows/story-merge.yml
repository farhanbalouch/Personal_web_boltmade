name: Weekly biography update
on:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: farhan-content-publishing
  cancel-in-progress: false
jobs:
  merge-story:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add relevant blog details to biography
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/merge-story.mjs
      - name: Prepare notification receipt
        run: |
          node --input-type=module -e '
            import {execFileSync} from "node:child_process";
            import {readFileSync,writeFileSync} from "node:fs";
            const changed=execFileSync("git",["diff","--name-only","src/data/story-chapters.json"],{encoding:"utf8"}).trim();
            const id="weekly-"+process.env.GITHUB_RUN_ID;
            if(changed){
              const receipts=JSON.parse(readFileSync("public/publish-receipts.json","utf8"));
              receipts.push(id);writeFileSync("public/publish-receipts.json",JSON.stringify(receipts.slice(-500),null,2)+"\n");
            }
            writeFileSync("content/weekly-notifications.json",JSON.stringify(changed?[{id,title:"A new page in my story",message:"My biography has been updated with details from recent blogs.",url:"https://farhanbalouch.com/story"}]:[]));
          '
      - name: Publish biography update
        run: |
          git config user.name "Farhan Studio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/story-chapters.json content public/publish-receipts.json
          if ! git diff --cached --quiet; then
            git commit -m "Update biography from recent blog posts"
            git pull --rebase origin main
            git push
          fi
      - name: Notify after deployment
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: node scripts/wait-for-live.mjs content/weekly-notifications.json
      - name: Report any failed AI classifications
        run: test "$(cat content/weekly-failed.txt)" = "0"
