name: Publish from Farhan Studio
run-name: Publish Studio content
on:
  push:
    branches: [main]
    paths: ['content/requests/**']
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: farhan-content-publishing
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Edit and translate queued notes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/publish-studio.mjs
      - name: Update sitemap
        run: node scripts/build-sitemap.mjs
      - name: Publish content to repository
        run: |
          git config user.name "Farhan Studio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content src/data public
          if ! git diff --cached --quiet; then
            git commit -m "Publish edited content from Farhan Studio"
            git pull --rebase origin main
            git push
          fi
      - name: Wait until public, then notify audience
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: node scripts/wait-for-live.mjs
      - name: Report any failed AI requests
        run: test "$(cat content/studio-failed.txt)" = "0"
