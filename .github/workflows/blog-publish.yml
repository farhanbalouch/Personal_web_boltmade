name: Publish legacy blog drafts
on:
  push:
    branches: [main]
    paths: ['content/drafts/**']
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: farhan-content-publishing
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish new drafts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/publish-blog.mjs
      - name: Prepare delivery receipts
        run: |
          node --input-type=module -e '
            import {readFileSync,writeFileSync} from "node:fs";
            const posts=JSON.parse(readFileSync("content/last-published.json","utf8"));
            const notes=posts.map((p,i)=>({...p,id:"blog-"+process.env.GITHUB_RUN_ID+"-"+i,message:"New post: "+p.title}));
            const receipts=JSON.parse(readFileSync("public/publish-receipts.json","utf8"));
            receipts.push(...notes.map(n=>n.id));
            writeFileSync("public/publish-receipts.json",JSON.stringify(receipts.slice(-500),null,2)+"\n");
            writeFileSync("content/blog-notifications.json",JSON.stringify(notes,null,2)+"\n");
          '
      - name: Update sitemap
        run: node scripts/build-sitemap.mjs
      - name: Commit and push
        run: |
          git config user.name "Farhan Studio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content src/data/blog-posts.json public
          if ! git diff --cached --quiet; then
            git commit -m "Publish new blog posts"
            git pull --rebase origin main
            git push
          fi
      - name: Notify after deployment
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: node scripts/wait-for-live.mjs content/blog-notifications.json
