name: Publish blog draft

# Runs whenever a file is added/changed under content/drafts/.
on:
  push:
    branches: [main]
    paths:
      - 'content/drafts/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish new drafts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/publish-blog.mjs

      - name: Commit and push
        run: |
          git config user.name "muhammadfarhan138223-cmyk"
          git config user.email "Muhammadfarhan138223@gmail.com"
          git add content/drafts content/published-drafts content/last-published.json src/data/blog-posts.json public/sitemap.xml

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore(blog): auto-publish new post(s)"
            git push
          fi

      - name: Notify subscribers (push + email)
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: |
          node -e '
            const posts = require("./content/last-published.json");
            const { execSync } = require("child_process");
            for (const p of posts) {
              console.log("Notifying for:", p.title);
              execSync(
                `node scripts/notify-onesignal.mjs ${JSON.stringify(p.title)} ${JSON.stringify("New post: " + p.title)} ${JSON.stringify(p.url)}`,
                { stdio: "inherit" }
              );
            }
          '
